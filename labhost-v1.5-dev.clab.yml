name: labhost-v15-dev

mgmt:
  network: clab
  ipv4-subnet: 172.20.21.0/24

topology:
  nodes:
    host1:
      kind: linux
      image: ghcr.io/sphoffman/labhost:1.5-dev1
      mgmt-ipv4: 172.20.21.101
      env:
        LAB_PASSWORD: lab
      sysctls:
        net.ipv4.tcp_l3mdev_accept: 1
      cap-add:
        - NET_ADMIN
        - NET_RAW

    host2:
      kind: linux
      image: ghcr.io/sphoffman/labhost:1.5-dev1
      mgmt-ipv4: 172.20.21.102
      env:
        LAB_PASSWORD: lab
      sysctls:
        net.ipv4.tcp_l3mdev_accept: 1
      cap-add:
        - NET_ADMIN
        - NET_RAW

  links:
    - endpoints: ["host1:eth1", "host2:eth1"]
    - endpoints: ["host1:eth2", "host2:eth2"]
