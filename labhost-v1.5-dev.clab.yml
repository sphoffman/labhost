name: labhost-v15-dev

mgmt:
  network: labhost-v15-dev-mgmt
  ipv4-subnet: auto

topology:
  nodes:
    host1:
      kind: linux
      image: ghcr.io/sphoffman/labhost:1.5-dev7
      env:
        LAB_PASSWORD: lab
      binds:
        - ./labhost-v1.5-dev-configs:/config
      sysctls:
        net.ipv4.tcp_l3mdev_accept: 1
      cap-add:
        - NET_ADMIN
        - NET_RAW

    host2:
      kind: linux
      image: ghcr.io/sphoffman/labhost:1.5-dev7
      env:
        LAB_PASSWORD: lab
      binds:
        - ./labhost-v1.5-dev-configs:/config
      sysctls:
        net.ipv4.tcp_l3mdev_accept: 1
      cap-add:
        - NET_ADMIN
        - NET_RAW

  links:
    - endpoints: ["host1:eth1", "host2:eth1"]
    - endpoints: ["host1:eth2", "host2:eth2"]
