name: Repair v1.5 GHCR tag

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-v1.5-ghcr-tag.yml

permissions:
  contents: read
  packages: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy latest manifest to 1.5 and verify digest
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}"

          docker buildx imagetools create \
            --tag "${image}:1.5" \
            "${image}:latest"

          latest_digest="$(docker buildx imagetools inspect "${image}:latest" | awk '/^Digest:/ {print $2; exit}')"
          version_digest="$(docker buildx imagetools inspect "${image}:1.5" | awk '/^Digest:/ {print $2; exit}')"

          test -n "$latest_digest"
          test -n "$version_digest"
          test "$latest_digest" = "$version_digest"

          echo "Verified ${image}:1.5 == ${image}:latest == ${latest_digest}"
