name: Publish container image

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Container version, such as 1.5
        required: true
        default: "1.5"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            raw="${{ github.event.release.tag_name }}"
          else
            raw="${{ inputs.version }}"
          fi

          version="$(bash scripts/release-version "$raw")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Verify image tags
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          grep -Fxq "ghcr.io/${GITHUB_REPOSITORY}:${VERSION}" <<<"$IMAGE_TAGS"
          grep -Fxq "ghcr.io/${GITHUB_REPOSITORY}:latest" <<<"$IMAGE_TAGS"

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
