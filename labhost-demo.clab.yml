name: labhost-demo

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24

topology:
  nodes:
    client1:
      kind: linux
      image: ghcr.io/sphoffman/labhost:1.5
      mgmt-ipv4: 172.20.20.101
      env:
        LAB_PASSWORD: lab
      binds:
        - ./configs:/config
        - ./pcaps/client1:/pcaps
        - ./scripts:/scripts
      cap-add:
        - NET_ADMIN
        - NET_RAW
      sysctls:
        net.ipv4.tcp_l3mdev_accept: "1"

    client2:
      kind: linux
      image: ghcr.io/sphoffman/labhost:1.5
      mgmt-ipv4: 172.20.20.102
      env:
        LAB_PASSWORD: lab
      binds:
        - ./configs:/config
        - ./pcaps/client2:/pcaps
        - ./scripts:/scripts
      cap-add:
        - NET_ADMIN
        - NET_RAW
      sysctls:
        net.ipv4.tcp_l3mdev_accept: "1"

  links:
    # Replace these with your actual Junos node/interface names.
    # - endpoints: ["client1:eth1", "leaf1:eth1"]
    # - endpoints: ["client1:eth2", "leaf2:eth1"]
    # - endpoints: ["client2:eth1", "leaf1:eth2"]
